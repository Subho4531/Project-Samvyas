<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2050 720" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-pink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f472b6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="grad-stage1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grad-stage2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grad-stage3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grad-stage4a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grad-stage4b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grad-stage5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grad-stage6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="80" y="55" fill="#f8fafc" font-size="28" font-weight="700" letter-spacing="-0.5px">SAMVYAS 2.0: StyleTTS 2 Bengali Expressive Voice Twin Pipeline</text>
  <text x="80" y="85" fill="#94a3b8" font-size="15" font-weight="400">Decoupled Architecture: LLM 'The Director' (Emotion Tags) ➔ StyleTTS 2 'The Actor' (Sub-300ms Expressive Voice)</text>

  <!-- STAGE 1: STT Worker -->
  <g filter="url(#card-shadow)">
    <rect x="80" y="140" width="240" height="250" rx="14" fill="url(#grad-stage1)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="95" y="155" width="210" height="34" rx="8" fill="#0284c7" fill-opacity="0.5"/>
    <text x="110" y="178" fill="#e0f2fe" font-size="16" font-weight="700">🎙️ 1. STT Worker</text>
    <text x="98" y="215" fill="#bae6fd" font-size="13" font-weight="600">Audio Ingestion &amp; ASR</text>
    <text x="98" y="240" fill="#f0f9ff" font-size="12">• Mic Audio (Mono 16kHz)</text>
    <text x="98" y="260" fill="#f0f9ff" font-size="12">• DeepFilterNet Denoising</text>
    <text x="98" y="280" fill="#f0f9ff" font-size="12">• NeMo IndicConformer (bn)</text>
    <text x="98" y="300" fill="#f0f9ff" font-size="12">• Real-time Agg Tokenizer</text>
    <text x="98" y="325" fill="#38bdf8" font-size="12" font-weight="600">⚡ Output: "তুমি কাল কেন আসোনি?"</text>
    <rect x="95" y="350" width="100" height="24" rx="6" fill="#0369a1"/>
    <text x="105" y="366" fill="#e0f2fe" font-size="11" font-weight="600">⏱️ Latency: ~180ms</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 320 265 L 360 265" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <text x="325" y="255" fill="#38bdf8" font-size="11" font-weight="600">Text</text>

  <!-- STAGE 2: LLM Director -->
  <g filter="url(#card-shadow)">
    <rect x="365" y="140" width="260" height="250" rx="14" fill="url(#grad-stage2)" stroke="#c084fc" stroke-width="2"/>
    <rect x="380" y="155" width="230" height="34" rx="8" fill="#7e22ce" fill-opacity="0.5"/>
    <text x="395" y="178" fill="#f3e8ff" font-size="16" font-weight="700">🧠 2. LLM Director</text>
    <text x="383" y="215" fill="#e9d5ff" font-size="13" font-weight="600">Semantic &amp; Prosody Control</text>
    <text x="383" y="240" fill="#faf5ff" font-size="12">• Gemini 2.5 Flash / Local LLM</text>
    <text x="383" y="260" fill="#faf5ff" font-size="12">• System Directing Prompt</text>
    <text x="383" y="280" fill="#faf5ff" font-size="12">• Tagged Streaming Generation</text>
    <text x="383" y="300" fill="#faf5ff" font-size="12">  [warm], [excited], [whisper]</text>
    <text x="383" y="325" fill="#c084fc" font-size="12" font-weight="600">⚡ "[warm] শরীরটা খারাপ ছিল..."</text>
    <rect x="380" y="350" width="105" height="24" rx="6" fill="#6b21a8"/>
    <text x="390" y="366" fill="#f3e8ff" font-size="11" font-weight="600">⏱️ TTFT: ~220ms</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 625 265 L 665 265" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#arr-purple)"/>
  <text x="630" y="255" fill="#c084fc" font-size="11" font-weight="600">Stream</text>

  <!-- STAGE 3: Parser & Chunker -->
  <g filter="url(#card-shadow)">
    <rect x="670" y="140" width="250" height="250" rx="14" fill="url(#grad-stage3)" stroke="#fb923c" stroke-width="2"/>
    <rect x="685" y="155" width="220" height="34" rx="8" fill="#c2410c" fill-opacity="0.5"/>
    <text x="700" y="178" fill="#ffedd5" font-size="16" font-weight="700">⚡ 3. Tag Parser</text>
    <text x="688" y="215" fill="#fed7aa" font-size="13" font-weight="600">Sentence Split &amp; Route</text>
    <text x="688" y="240" fill="#fff7ed" font-size="12">• Clause &amp; Dari '।' Chunker</text>
    <text x="688" y="260" fill="#fff7ed" font-size="12">• Regex Bracket Tag Extractor</text>
    <text x="688" y="280" fill="#fff7ed" font-size="12">• Emits Utterance Units:</text>
    <text x="688" y="300" fill="#fff7ed" font-size="12">  - Text: "শরীরটা খারাপ ছিল"</text>
    <text x="688" y="325" fill="#fb923c" font-size="12" font-weight="600">  - Style: "warm" (intensity 1.0)</text>
    <rect x="685" y="350" width="95" height="24" rx="6" fill="#9a3412"/>
    <text x="695" y="366" fill="#ffedd5" font-size="11" font-weight="600">⏱️ Parse: ~2ms</text>
  </g>

  <!-- Branching Arrows 3 -> 4A and 3 -> 4B -->
  <path d="M 920 220 C 950 220, 950 140, 985 140" stroke="#2dd4bf" stroke-width="2.5" fill="none" marker-end="url(#arr-teal)"/>
  <text x="930" y="165" fill="#2dd4bf" font-size="11" font-weight="600">Text</text>

  <path d="M 920 310 C 950 310, 950 380, 985 380" stroke="#f472b6" stroke-width="2.5" fill="none" marker-end="url(#arr-pink)"/>
  <text x="930" y="360" fill="#f472b6" font-size="11" font-weight="600">Emotion</text>

  <!-- STAGE 4A: Bengali G2P -->
  <g filter="url(#card-shadow)">
    <rect x="990" y="40" width="270" height="210" rx="14" fill="url(#grad-stage4a)" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="1005" y="55" width="240" height="34" rx="8" fill="#0f766e" fill-opacity="0.5"/>
    <text x="1020" y="78" fill="#ccfbf1" font-size="16" font-weight="700">📝 4A. Bengali G2P</text>
    <text x="1008" y="115" fill="#99f6e4" font-size="13" font-weight="600">Normalizer &amp; IPA Tokenizer</text>
    <text x="1008" y="138" fill="#f0fdfa" font-size="12">• BengaliTextNormalizer (NFC)</text>
    <text x="1008" y="158" fill="#f0fdfa" font-size="12">• Digits '০-৯' ➔ Spoken Words</text>
    <text x="1008" y="178" fill="#f0fdfa" font-size="12">• BengaliPhonemizer (IPA)</text>
    <text x="1008" y="198" fill="#f0fdfa" font-size="12">• Juktakkhor Conjunct Splits</text>
    <text x="1008" y="222" fill="#2dd4bf" font-size="12" font-weight="600">⚡ IPA Tokens: [ʃ, ɔ, r, i, r, ...]</text>
  </g>

  <!-- STAGE 4B: Style Bank -->
  <g filter="url(#card-shadow)">
    <rect x="990" y="280" width="270" height="210" rx="14" fill="url(#grad-stage4b)" stroke="#f472b6" stroke-width="2"/>
    <rect x="1005" y="295" width="240" height="34" rx="8" fill="#be123c" fill-opacity="0.5"/>
    <text x="1020" y="318" fill="#ffe4e6" font-size="16" font-weight="700">🎭 4B. Style Bank</text>
    <text x="1008" y="355" fill="#fecdd3" font-size="13" font-weight="600">Acoustic Latent Repository</text>
    <text x="1008" y="378" fill="#fff1f2" font-size="12">• Curated 'style_bank.pt'</text>
    <text x="1008" y="398" fill="#fff1f2" font-size="12">• 64-dim Jeet Style Vectors</text>
    <text x="1008" y="418" fill="#fff1f2" font-size="12">• [warm, excited, whisper, ...]</text>
    <text x="1008" y="438" fill="#fff1f2" font-size="12">• Continuous Interpolation:</text>
    <text x="1008" y="462" fill="#f472b6" font-size="12" font-weight="600">⚡ s = α·s_A + (1-α)·s_B</text>
  </g>

  <!-- Merging Arrows 4A -> 5 and 4B -> 5 -->
  <path d="M 1260 145 C 1290 145, 1290 220, 1320 220" stroke="#2dd4bf" stroke-width="2.5" fill="none" marker-end="url(#arr-teal)"/>
  <text x="1265" y="175" fill="#2dd4bf" font-size="11" font-weight="600">Token IDs</text>

  <path d="M 1260 385 C 1290 385, 1290 310, 1320 310" stroke="#f472b6" stroke-width="2.5" fill="none" marker-end="url(#arr-pink)"/>
  <text x="1265" y="355" fill="#f472b6" font-size="11" font-weight="600">Style Vector</text>

  <!-- STAGE 5: StyleTTS 2 Engine -->
  <g filter="url(#card-shadow)">
    <rect x="1330" y="120" width="320" height="290" rx="14" fill="url(#grad-stage5)" stroke="#4ade80" stroke-width="2"/>
    <rect x="1345" y="135" width="290" height="34" rx="8" fill="#15803d" fill-opacity="0.5"/>
    <text x="1360" y="158" fill="#dcfce7" font-size="16" font-weight="700">🎬 5. StyleTTS 2 Engine</text>
    <text x="1348" y="195" fill="#bbf7d0" font-size="13" font-weight="600">Decoupled Neural Acoustic Synthesizer</text>
    <text x="1348" y="220" fill="#f0fdf4" font-size="12">• Speaker Timbre: Jeet Voice Weights</text>
    <text x="1348" y="240" fill="#f0fdf4" font-size="12">• Prosody Predictor: GRU conditioned on s</text>
    <text x="1348" y="260" fill="#f0fdf4" font-size="12">• Dynamic F0 Contour &amp; Energy Prediction</text>
    <text x="1348" y="280" fill="#f0fdf4" font-size="12">• Single-Pass AdaIN Generator (ResBlocks)</text>
    <text x="1348" y="300" fill="#f0fdf4" font-size="12">• Vocos Neural Vocoder (24kHz Hi-Fi)</text>
    <text x="1348" y="330" fill="#4ade80" font-size="13" font-weight="700">⚡ Single-Pass: ~250ms (RTF &lt; 0.1!)</text>
    <rect x="1345" y="355" width="170" height="26" rx="6" fill="#166534"/>
    <text x="1355" y="372" fill="#dcfce7" font-size="11" font-weight="600">💾 VRAM: ~1.7 GB (RTX 2050)</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 1650 265 L 1700 265" stroke="#4ade80" stroke-width="2.5" fill="none" marker-end="url(#arr-green)"/>
  <text x="1655" y="255" fill="#4ade80" font-size="11" font-weight="600">24kHz WAV</text>

  <!-- STAGE 6: Stream Playback -->
  <g filter="url(#card-shadow)">
    <rect x="1710" y="140" width="250" height="250" rx="14" fill="url(#grad-stage6)" stroke="#22d3ee" stroke-width="2"/>
    <rect x="1725" y="155" width="220" height="34" rx="8" fill="#0891b2" fill-opacity="0.5"/>
    <text x="1740" y="178" fill="#cffafe" font-size="16" font-weight="700">🔊 6. Playback Queue</text>
    <text x="1728" y="215" fill="#a5f3fc" font-size="13" font-weight="600">Client Stream Delivery</text>
    <text x="1728" y="240" fill="#ecfeff" font-size="12">• Peak Attenuation (-1.0 dB)</text>
    <text x="1728" y="260" fill="#ecfeff" font-size="12">• Dual Format Generation:</text>
    <text x="1728" y="280" fill="#ecfeff" font-size="12">  - 24 kHz Hi-Fi PCM</text>
    <text x="1728" y="300" fill="#ecfeff" font-size="12">  - 16 kHz Resampled PCM</text>
    <text x="1728" y="325" fill="#22d3ee" font-size="12" font-weight="600">⚡ Chained Web Audio API</text>
    <rect x="1725" y="350" width="130" height="24" rx="6" fill="#0e7490"/>
    <text x="1735" y="366" fill="#cffafe" font-size="11" font-weight="600">🎯 Total E2E: &lt; 600ms</text>
  </g>

  <!-- BOTTOM BOX: Offline Training & Identity Calibration -->
  <g filter="url(#card-shadow)">
    <rect x="365" y="440" width="1285" height="220" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="385" y="455" width="460" height="32" rx="6" fill="#334155"/>
    <text x="400" y="476" fill="#f1f5f9" font-size="15" font-weight="700">🛠️ Offline Training &amp; Calibration Foundation (Kaggle T4 / Local GPU)</text>
    
    <text x="390" y="515" fill="#e2e8f0" font-size="13" font-weight="600">1. Timbre Foundation (Jeet Voice Data):</text>
    <text x="390" y="535" fill="#94a3b8" font-size="12">   80 accepted studio takes (~500s clean speech) provide the fundamental vocal timbre, formant resonance, and pitch baseline.</text>
    
    <text x="390" y="565" fill="#e2e8f0" font-size="13" font-weight="600">2. Emotion Anchor Set (Acoustic Range):</text>
    <text x="390" y="585" fill="#94a3b8" font-size="12">   30-40 targeted emotional takes (Excited, Warm, Whisper, Serious, Inquisitive). Acoustic Style Encoder extracts them into 'style_bank.pt'.</text>
    
    <text x="390" y="615" fill="#e2e8f0" font-size="13" font-weight="600">3. Decoupled Adaptation Regimen:</text>
    <text x="390" y="635" fill="#94a3b8" font-size="12">   Freeze text encoder; adapt AdaIN decoder &amp; duration predictor via adversarial loss (~3 hrs on Kaggle T4). Solves voice drift permanently!</text>
  </g>

  <!-- Connecting dashed arrows from Training Box -->
  <path d="M 1080 440 L 1080 395" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arr-gray)"/>
  <text x="1090" y="425" fill="#94a3b8" font-size="11" font-weight="600">Extracts Style Vectors</text>

  <path d="M 1480 440 L 1480 415" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arr-gray)"/>
  <text x="1490" y="430" fill="#94a3b8" font-size="11" font-weight="600">Jeet Timbre Weights</text>

</svg>