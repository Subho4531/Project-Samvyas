[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samvyas"
version = "0.1.0"
description = "Samvyas: Multilingual Multimodal Voice Intelligence"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Samvyas Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "einops>=0.7.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "scipy>=1.11.0",
    "sounddevice>=0.5.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.23.0",
    "wandb>=0.17.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["samvyas*"]

[tool.ruff]
line-length = 100
target-version = "py310"
